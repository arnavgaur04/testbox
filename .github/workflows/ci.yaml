name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: make lint
      - run: go test ./... -count=1
      - run: go build ./...

  live-docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build -o testbox-tool ./cmd/core-service
      - run: ./testbox-tool -repo . run
      - run: sleep 5 && curl --retry 5 --retry-delay 2 -s -o /dev/null -w "HTTP:%{http_code}\n" http://localhost:8080 | grep -q "HTTP:200"
      - run: ./testbox-tool -repo . status
      - run: ./testbox-tool -repo . status | grep -q mcp
      - run: ./testbox-tool -repo . logs
      - run: ./testbox-tool -repo . down
