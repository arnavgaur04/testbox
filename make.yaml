app:
  name: "my-test-app"
  version: "0.1.0"

docker:
  context: "."
  dockerfile: "Dockerfile"
  image_name: "my-test-app:latest"

local_deploy:
  auto_generate_compose: true
  services:
    - service_name: "my-test-app"
      port: 8080
      container_port: 80

mcp:
  enabled: true
  openapi: ./mcp-openapi.yaml
  tools_file: ./mcp-tools.yaml
  port: 8082

